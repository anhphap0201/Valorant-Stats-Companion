<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Valorant Official Tracker</title>
    <style>
        body { font-family: sans-serif; background-color: #0f1923; color: #ece8e1; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #1e2833; padding: 20px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin-top: 5px; background: #0f1923; color: white; border: 1px solid #333; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ff4655; color: white; border: none; cursor: pointer; font-weight: bold; }
        pre { background: #000; padding: 10px; color: #a5d6a7; overflow: auto; max-height: 400px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>VALORANT OFFICIAL TRACKER</h2>

    <div class="form-group">
        <label>Riot API Key (RGAPI-...):</label>
        <input type="password" id="riotKey" placeholder="Dán API Key của bạn vào đây...">
    </div>

    <div class="form-group">
        <label>Riot ID (Tên#Tag):</label>
        <input type="text" id="riotId" placeholder="VD: Tên#Tag">
    </div>

    <button onclick="startTracking()">LẤY DỮ LIỆU CÁ NHÂN</button>
    <div id="resultArea"></div>
</div>

<script>
    async function startTracking() {
        const apiKey = document.getElementById('riotKey').value.trim();
        const riotIdInput = document.getElementById('riotId').value.trim();
        const resultArea = document.getElementById('resultArea');

        if (!apiKey || !riotIdInput.includes('#')) {
            resultArea.innerHTML = "❌ Vui lòng nhập đủ Key và đúng định dạng Tên#Tag!";
            return;
        }

        const [gameName, tagLine] = riotIdInput.split('#');
        resultArea.innerHTML = "⏳ Đang lấy PUUID...";

        try {
            // 1. Lấy PUUID từ account-v1 (Server asia)
            const accountUrl = `https://asia.api.riotgames.com/riot/account/v1/accounts/by-riot-id/${encodeURIComponent(gameName)}/${encodeURIComponent(tagLine)}?api_key=${apiKey}`;
            const accRes = await fetch(accountUrl);
            const accData = await accRes.json();

            if (!accRes.ok) throw new Error("Không tìm thấy người chơi: " + accData.status.message);

            resultArea.innerHTML = `⏳ Đã tìm thấy PUUID: ${accData.puuid}. Đang lấy lịch sử đấu...`;

            // 2. Lấy Match History từ val-match-v1 (Server ap)
            const matchUrl = `https://ap.api.riotgames.com/val/match/v1/matchlists/by-puuid/${accData.puuid}?api_key=${apiKey}`;
            const matchRes = await fetch(matchUrl);
            const matchData = await matchRes.json();

            if (!matchRes.ok) throw new Error("Không lấy được lịch sử đấu. Key của bạn có quyền truy cập Match API không?");

            resultArea.innerHTML = `<pre>${JSON.stringify(matchData, null, 2)}</pre>`;
        } catch (e) {
            resultArea.innerHTML = "❌ Lỗi: " + e.message;
        }
    }
</script>
</body>
</html>
